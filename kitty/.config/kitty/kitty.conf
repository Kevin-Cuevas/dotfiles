# ==============================================================================
# kitty.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# Environment
# ------------------------------------------------------------------------------

env LC_ALL=en_US.UTF-8
env LANG=en_US.UTF-8
env LC_CTYPE=en_US.UTF-8

# ------------------------------------------------------------------------------
# Clipboard / remote control
# ------------------------------------------------------------------------------

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_remote_control yes

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------

include current-theme.conf

# dim_opacity isn't a color, so kitty's light/dark auto-switch (which only
# re-applies color keys from *-theme.auto.conf) never touches it — it has to
# live here instead. Default (0.4) blends DIM/FAINT text toward the background
# assuming a dark terminal; on a light bg that leaves ~2:1 contrast (nearly
# invisible, e.g. Claude Code's muted status lines). 0.75 keeps dim text
# visibly softer than normal text while staying readable in both themes.
dim_opacity 0.75

# ------------------------------------------------------------------------------
# Window layout
# ------------------------------------------------------------------------------

window_margin_width 4
window_padding_width 4
remember_window_size no
initial_window_width 1000
initial_window_height 600

# ------------------------------------------------------------------------------
# Bell / cursor / shell integration
# ------------------------------------------------------------------------------

enable_audio_bell no
cursor_shape block
cursor_trail 1
cursor_trail_decay 0.01 0.5 
cursor_trail_start_threshold 0
shell_integration enabled no-cursor

# ------------------------------------------------------------------------------
# Font
# ------------------------------------------------------------------------------

font_family FiraCode Nerd Font

# ------------------------------------------------------------------------------
# Keyboard
# ------------------------------------------------------------------------------

map ctrl+shift+enter no_op
map ctrl+shift+[ no_op
map ctrl+shift+] no_op
map ctrl+shift+w no_op

# ------------------------------------------------------------------------------
# Performance
# ------------------------------------------------------------------------------

repaint_delay 5
input_delay 0
sync_to_monitor no
wayland_enable_ime no
