# ----------------------------------------------------------
# THEME COLORS: Nord, via terminal palette (no light/dark split)
#
# Uses `default` + indexed colours (colour0-15) instead of hex, so the
# status bar just inherits whatever palette the terminal (kitty) currently
# has loaded — including its own light/dark auto-switch. No watcher, no
# systemd service, and it also picks up the *local* kitty theme when tmux
# is running on a remote host over SSH, since palette-index -> RGB is
# resolved client-side by the terminal doing the rendering, not by tmux.
#
# Trade-off: only 16 slots. kitty's light-theme.auto.conf swaps colour3/11
# relative to the dark theme (contrast tuning), so the PREFIX badge (colour3)
# and the zoom icon (colour11) end up swapping gold<->orange between dark
# and light mode instead of each staying a fixed hue. Cosmetic only.
# ----------------------------------------------------------
set -g status-style "bg=default,fg=default"

# left: PREFIX badge --> session --> current pane path
set -g status-left "#{?client_prefix,#[bg=colour3 fg=colour0 bold]  PREFIX  #[bg=default fg=colour3],#[bg=colour6 fg=colour0 bold] 󰎤 #S #[bg=default fg=colour6]}#[bg=colour0,fg=default]#[bg=colour0,fg=colour4]"

# right: user, hostname, time && date
set -g status-right "#{?#{==:#{pane_current_command},ssh},󰒍 server,󰉋 #{b:pane_current_path}} #[bg=default,fg=colour0] #[fg=colour8]│ #[fg=colour2]󰀄 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_user},#{@ssh_user},…},#(whoami)} #[fg=colour8]│ #[fg=colour4] 󰣚 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_host},#{@ssh_host},…},#H} #[fg=colour8]"

# ----------------------------------------------------------
# LABEL HELPERS  (expanded elsewhere via #{E:@name})
# ----------------------------------------------------------
# @cmd_icon  : Nerd Font glyph for the pane's running command. It's a flat
#              #{?cond,icon,#{?cond,icon,...,fallback}} chain, one clause per
#              icon; each cond is an OR of #{==:#{pane_current_command},name}.
#              To map a new command, drop another #{==:...} into the matching
#              clause's #{||:...}. Every glyph has a one-space suffix (uniform:
#              FiraCode NF advances are all 1 cell) and the last clause doubles
#              as the fallback -- a terminal glyph for shells / unknown commands.
# @pane_label: the active pane's custom @pane_name, else its running command.
# @win_label : the text a tab shows in the status bar --
#   * tab NOT renamed        -> @pane_label   (live: command or pane name)
#   * tab renamed (prefix ,) -> your custom name, followed by @pane_label in
#                               dim grey (active pane's custom name, else its
#                               running command); the suffix is hidden when it
#                               would just repeat the tab name.
#   Detection: `rename-window` flips `automatic-rename` off on that window,
#   so #{automatic-rename} == our "is this tab manually named?" flag.
#   prefix , with an empty name flips automatic-rename back on (default).
set -g @cmd_icon "#{?#{||:#{==:#{pane_current_command},nvim},#{||:#{==:#{pane_current_command},vim},#{||:#{==:#{pane_current_command},vi},#{||:#{==:#{pane_current_command},hx},#{==:#{pane_current_command},nano}}}}}, ,#{?#{||:#{==:#{pane_current_command},node},#{||:#{==:#{pane_current_command},npm},#{||:#{==:#{pane_current_command},pnpm},#{||:#{==:#{pane_current_command},yarn},#{||:#{==:#{pane_current_command},bun},#{||:#{==:#{pane_current_command},deno},#{||:#{==:#{pane_current_command},tsx},#{||:#{==:#{pane_current_command},vite},#{==:#{pane_current_command},nodemon}}}}}}}}}, ,#{?#{||:#{==:#{pane_current_command},python},#{||:#{==:#{pane_current_command},python3},#{==:#{pane_current_command},ipython}}}, ,#{?#{||:#{==:#{pane_current_command},ssh},#{||:#{==:#{pane_current_command},mosh},#{==:#{pane_current_command},sftp}}}, ,#{?#{||:#{==:#{pane_current_command},cmus},#{||:#{==:#{pane_current_command},ncmpcpp},#{||:#{==:#{pane_current_command},mpv},#{||:#{==:#{pane_current_command},mpd},#{==:#{pane_current_command},spotify_player}}}}}, ,#{?#{||:#{==:#{pane_current_command},git},#{||:#{==:#{pane_current_command},lazygit},#{||:#{==:#{pane_current_command},tig},#{||:#{==:#{pane_current_command},gh},#{==:#{pane_current_command},gitui}}}}}, ,#{?#{||:#{==:#{pane_current_command},docker},#{||:#{==:#{pane_current_command},docker-compose},#{||:#{==:#{pane_current_command},lazydocker},#{||:#{==:#{pane_current_command},kubectl},#{||:#{==:#{pane_current_command},k9s},#{==:#{pane_current_command},podman}}}}}}, ,#{?#{||:#{==:#{pane_current_command},htop},#{||:#{==:#{pane_current_command},btop},#{||:#{==:#{pane_current_command},btm},#{||:#{==:#{pane_current_command},top},#{==:#{pane_current_command},glances}}}}}, ,#{?#{||:#{==:#{pane_current_command},psql},#{||:#{==:#{pane_current_command},mysql},#{||:#{==:#{pane_current_command},mycli},#{||:#{==:#{pane_current_command},sqlite3},#{==:#{pane_current_command},redis-cli}}}}}, ,#{?#{||:#{==:#{pane_current_command},lf},#{||:#{==:#{pane_current_command},yazi},#{||:#{==:#{pane_current_command},ranger},#{||:#{==:#{pane_current_command},nnn},#{==:#{pane_current_command},fzf}}}}}, ,#{?#{||:#{==:#{pane_current_command},man},#{||:#{==:#{pane_current_command},less},#{||:#{==:#{pane_current_command},bat},#{==:#{pane_current_command},moar}}}}, ,#{?#{||:#{==:#{pane_current_command},cargo},#{==:#{pane_current_command},rustc}}, ,#{?#{||:#{==:#{pane_current_command},go},#{==:#{pane_current_command},gopls}}, ,#{?#{||:#{==:#{pane_current_command},make},#{||:#{==:#{pane_current_command},cmake},#{||:#{==:#{pane_current_command},gcc},#{||:#{==:#{pane_current_command},cc},#{==:#{pane_current_command},ninja}}}}}, ,#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},sh},#{==:#{pane_current_command},dash}}}}}, , }}}}}}}}}}}}}}}"
set -g @pane_label "#{?#{@pane_name},#{@pane_name},#{pane_current_command}}"
set -g @win_label "#{?automatic-rename,#{E:@pane_label},#W#{?#{==:#W,#{E:@pane_label}},,#[fg=colour8]·#{E:@pane_label}}}"

# automatic-rename-format still feeds #W (used by choose-tree, etc.) when a
# tab is on auto; the status bar itself renders @win_label above.
set -g automatic-rename-format "#{?#{@pane_name},#{@pane_name},#{pane_current_command}}"
set -g window-status-format " #[fg=colour8]#I #{E:@cmd_icon}#[fg=colour8]#{E:@win_label} "
set -g window-status-current-format "#[bg=colour0,fg=colour6,bold] #I #[fg=colour4]#{E:@cmd_icon}#[fg=colour15,nobold]#{E:@win_label}#{?window_zoomed_flag, #[fg=colour11]󰍉 ,} "

# :: pane borders ::
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"

# :: messages ::
set -g message-style "bg=colour0,fg=colour3"
set -g message-command-style "bg=colour0,fg=colour6"

# :: copy mode ::
set -g mode-style "bg=colour8,fg=colour15"

# :: dual status bar ::
# line 1 (bottom) = the real bar   line 0 (above it) = live pane strip
# the -Fg copy grabs the stock bar template before we touch anything, so it
# still resolves status-left/right/window-status at render time.
set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g  'status-format[0]' '#[align=centre]#{P:#{?pane_active,#[fg=colour6]#[bold],#[fg=colour8]#[nobold]}#{pane_index} #{E:@cmd_icon}#{E:@pane_label}   }'
