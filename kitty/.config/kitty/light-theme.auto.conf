# vim:ft=kitty
## name: Iceberg Light, azules y grises Nord
## author: base Iceberg (cocopon/gkeep) + acentos Nord (Eric N. Vander Weele)
## upstream: https://gist.github.com/gkeep/3434864a3321fcce7d69e75d6d63888e
##           + https://www.nordtheme.com/
## blurb: Estructura de Iceberg Light con una paleta casi monocroma de
##        azules y grises de Nord (Frost 81a1c1/5e81ac/88c0d0/8fbcbb + Polar
##        Night 3b4252/434c5e/4c566a), con rojo bf616a y verde a3be8c como
##        unicas excepciones. Fondo del Nord Snow Storm original (#eceff4)
##        en vez del fondo mas oscuro de Iceberg (#e8e9ec). Los tonos
##        "casi-fondo" heredados de Iceberg (selection_background, borders,
##        tab bar, color5/7) estaban calibrados para ese fondo mas oscuro y
##        contra este fondo mas palido se veian como un recuadro de otro
##        color (el NormalFloat/FloatBorder de nvim) -- se reemplazaron por
##        sus equivalentes Nord canonicos (Nord4 #d8dee9, Nord5 #e5e9f0).

# Basic colors
foreground           #33374c
background           #eceff4
selection_foreground #33374c
selection_background #d8dee9

# Cursor colors
cursor            #33374c
cursor_text_color #eceff4

# URL underline color when hovering with mouse
url_color #5e81ac

# Window border colors and terminal bell colors
active_border_color   #5e81ac
inactive_border_color #d8dee9
bell_border_color     #bf616a
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #eceff4
active_tab_background   #5e81ac
inactive_tab_foreground #4c566a
inactive_tab_background #d8dee9
tab_bar_background      #e5e9f0
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #eceff4
mark1_background #88c0d0
mark2_foreground #eceff4
mark2_background #bf616a
mark3_foreground #33374c
mark3_background #a3be8c

# The basic 16 colors -- casi monocromo azul-gris Nord, con rojo/verde como
# unicas excepciones (ver blurb)
# black -- gris Polar Night, no color3/11 con calidez (sin amarillo/naranja
# en esta paleta)
color0 #3b4252
color8 #434c5e

# red -- unica excepcion junto al verde
color1 #bf616a
color9 #bf616a

# green -- la otra excepcion
color2  #a3be8c
color10 #a3be8c

# "yellow/orange" -- sin calidez en esta paleta, se queda en gris Nord
color3  #3b4252
color11 #4c566a

# blue -- el acento dominante
color4  #81a1c1
color12 #5e81ac

# magenta -- sin purpura en esta paleta
# color5 (regular, no bright) sigue funcionando como acento "blend with bg"
# para el rim de lavat (ver alias de zsh) -- gris claro cercano a este fondo.
# color13 se queda en gris Nord tambien, no purpura.
color5  #d8dee9
color13 #434c5e

# cyan -- familia azul-frost
color6  #88c0d0
color14 #8fbcbb

# white (kept light, not inverted: Powerlevel10k assumes color7/15 are
# always light for badge/chip backgrounds, regardless of terminal brightness)
color7  #d8dee9
color15 #eceff4
