# ----------------------------------------------------------
# THEME COLORS: Nord Snow Storm (light)
# Same accent palette as kitty's light-theme.auto.conf and nvim's
# nord-snow-storm colorscheme: Frost/Aurora accents darkened for contrast on
# a light bg, badge/chip backgrounds kept vivid since only the ink on top of
# them needs contrast, not the chip itself.
# ----------------------------------------------------------
set -g status-style "bg=#eceff4,fg=#2e3440"

# left: PREFIX badge --> session --> current pane path
set -g status-left "#{?client_prefix,#[bg=#EBCB8B fg=#2e3440 bold]  PREFIX  #[bg=#eceff4 fg=#EBCB8B],#[bg=#436f9a fg=#2e3440 bold] 󰎤 #S #[bg=#eceff4 fg=#436f9a]}#[bg=#d8dee9,fg=#2e3440]#[bg=#d8dee9,fg=#436f9a]"

# right: user, hostname, time && date
set -g status-right "#{?#{==:#{pane_current_command},ssh},󰒍 server,󰉋 #{b:pane_current_path}} #[bg=#eceff4,fg=#d8dee9] #[fg=#4C566A]│ #[fg=#56743c]󰀄 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_user},#{@ssh_user},…},#(whoami)} #[fg=#4C566A]│ #[fg=#436f9a] 󰣚 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_host},#{@ssh_host},…},#H} #[fg=#4C566A]"

# windows: zoom icon appears automatically on prefix+z
set -g window-status-format " #[fg=#4C566A]#I #[fg=#4C566A]#W "
set -g window-status-current-format "#[bg=#d8dee9,fg=#2d7488,bold] #I #[fg=#2e3440]#W#{?window_zoomed_flag, #[fg=#b04e2f]󰍉 ,} "

# :: pane borders ::
set -g pane-border-style "fg=#d8dee9"
set -g pane-active-border-style "fg=#436f9a"

# :: messages ::
set -g message-style "bg=#d8dee9,fg=#8e640f"
set -g message-command-style "bg=#d8dee9,fg=#2d7488"

# :: copy mode ::
set -g mode-style "bg=#d8dee9,fg=#2e3440"

# :: dual status bar spacing fill ::
set -g status-format[0] '#[bg=#eceff4,fill=#eceff4]#[align=centre] '
