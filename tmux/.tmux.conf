# ==========================================================
# TMUX CONFIG 
# ==========================================================

# ----------------------------------------------------------
# TERMINAL && COLORS
# ----------------------------------------------------------
set -as terminal-overrides ",*:RGB"
set -s set-clipboard on

# tmux-256color (italics, undercurl, etc.) si el host tiene su terminfo; si no
# (algún server viejo, Termux), screen-256color, que existe en todos lados.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# ----------------------------------------------------------
# GENERAL SETTINGS
# ----------------------------------------------------------
set -g mouse on                    # enable mouse support
set -g allow-passthrough on        # image passthrough for lazyvim
set -g visual-activity off         # disable visual notifications
set -sg escape-time 0
set -g history-limit 50000         # scrollback por pane (default: 2000)
set -g focus-events on             # nvim se entera al cambiar de pane (autoread, etc.)

# ----------------------------------------------------------
# PREFIX && MAIN KEYBINDS
# ----------------------------------------------------------
unbind C-b                                # remove default prefix
set-option -g prefix C-a                  # set C-a as prefix
bind-key C-a send-prefix                  # send literal prefix w/ C-a C-a
bind C-l send-keys 'C-l' \; clear-history # ctrl+l ==> clear scrollback

# ----------------------------------------------------------
# PANE SPLITTING
# ----------------------------------------------------------
unbind '"'
unbind %

# ----------------------------------------------------------
# PANE NAVIGATION
# ----------------------------------------------------------
# alt + arrow keys (no conflict w/ lazyvim), -Z keeps zoom when jumping panes.
# Re-zooming resizes the target pane from its frozen small size to fullscreen;
# zsh repaints the prompt but can't reflow scrollback, leaving ghost prompt
# lines. Send C-l only when the target is zoomed AND sitting at a zsh prompt:
# forces a clean redraw without touching running TUIs (nvim, less, …), wiping
# scrollback history, or firing on plain (unzoomed) pane hops.
bind -n M-Left  select-pane -L -Z \; if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{pane_current_command},zsh}}' 'send-keys C-l'
bind -n M-Right select-pane -R -Z \; if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{pane_current_command},zsh}}' 'send-keys C-l'
bind -n M-Up    select-pane -U -Z \; if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{pane_current_command},zsh}}' 'send-keys C-l'
bind -n M-Down  select-pane -D -Z \; if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{pane_current_command},zsh}}' 'send-keys C-l'

# ----------------------------------------------------------
# WINDOW MANAGEMENT
# ----------------------------------------------------------
bind c new-window -c "#{pane_current_path}"  # new window in $PWD

# prefix+, ==> rename current window; empty input restores automatic naming
bind , command-prompt -I "#W" -p "window name:" \
  "rename-window -- '%%' ; if-shell -F '#{==:#{window_name},}' 'setw automatic-rename on'"

# numbering starts at 1 (more intuitive)
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# fast window switching (alt+N, no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# prev/next window (vim muscle memory)
bind -n M-p previous-window        # alt+p ==> previous
bind -n M-n next-window            # alt+n ==> next

# ----------------------------------------------------------
# UTILITIES
# ----------------------------------------------------------
bind r source-file ~/.tmux.conf    # prefix+r ==> reload config

# ----------------------------------------------------------
# PANE RESIZING
# ----------------------------------------------------------
# alt+shift+H/J/K/L -- no prefix == fluid af
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ----------------------------------------------------------
# ADVANCED PANE MANAGEMENT
# ----------------------------------------------------------
bind f resize-pane -Z              # prefix+f ==> toggle zoom
bind x kill-pane                   # prefix+x ==> kill pane (no confirm)
bind X kill-window                 # prefix+X ==> kill entire window
bind Space next-layout             # prefix+space ==> rotate layouts

# alt + t ==> scratch shell floating above the current pane, even a zoomed
# one (-A), in its directory: run `git status` / `npm i` without unzooming.
# Pressed inside the float it closes it, but only at a bare zsh prompt so a
# running command is never killed (exit / C-d work too). tmux 3.8+ only:
# older versions have no floating panes, so the %if skips it there.
%if "#{!=:#{dark-theme-black},}"
bind -n M-t if-shell -F '#{pane_floating_flag}' \
  "if-shell -F '#{==:#{pane_current_command},zsh}' 'kill-pane' 'display-message \"float busy: exit or C-c first\"'" \
  'new-pane -A -x 80% -y 60% -X 10% -Y 20% -c "#{pane_current_path}"'
%endif

# prefix+. ==> rename current pane; empty input unsets it (label falls back to cmd)
bind . command-prompt -I "#{@pane_name}" -p "pane name:" \
  "set -p @pane_name '%%' ; if-shell -F '#{==:#{@pane_name},}' 'set -pu @pane_name'"

# ----------------------------------------------------------
# SMART SPLITS (always in $PWD)
# ----------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ----------------------------------------------------------
# COPY MODE (vim-compatible)
# ----------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# y ==> copia. Con set-clipboard on, tmux SIEMPRE manda además OSC 52 a la
# terminal de afuera, que es lo que funciona por SSH (kitty acepta
# write-clipboard). copy-command solo se define con Wayland local + wl-copy, así
# que en un server no se intenta correr un wl-copy que no existe.
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'set -s copy-command "wl-copy"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# ----------------------------------------------------------
# PANE SYNC (useful for multi-server ops)
# ----------------------------------------------------------
bind S set-window-option synchronize-panes\; display-message "Sync panes: #{?synchronize-panes,ON,OFF}"

# ----------------------------------------------------------
# STATUS BAR POSITION
# ----------------------------------------------------------
# set -g status-position top       # uncomment for top bar

set -g pane-border-status top
# pane-border-format lives in ~/.tmux-theme.conf (pill uses its colours)
set -g pane-border-style "fg=#4C566A,bg=#2E3440"
set -g pane-active-border-style "fg=#88C0D0,bg=#2E3440"
set -g pane-border-lines heavy

# ----------------------------------------------------------
# PLUGINS
# ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'          # plugin manager
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-resurrect'  # save sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save sessions

# ----------------------------------------------------------
# THEME: Nord / Nord Snow Storm, Powerline Path (auto light/dark)
# ----------------------------------------------------------
# :: status bar ::
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 90
set -g status-right-length 180
set -g window-status-separator ""

# The dual status bar (status 2 + line reorder) lives in ~/.tmux-theme.conf
# next to the styling it depends on, so load order can't break it.
#
# Colors live in ~/.tmux-theme.conf as indexed colours (colour0-15), so
# they follow whatever palette kitty currently has loaded (including its
# own light/dark auto-switch) with no separate watcher needed.
source-file ~/.tmux-theme.conf

# ----------------------------------------------------------
# TPM INIT (always at the end, no exceptions)
# ----------------------------------------------------------
run-shell ~/.tmux/plugins/tpm/tpm
