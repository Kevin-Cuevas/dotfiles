# vim:ft=kitty
## name: Nord Snow Storm (Light)
## upstream: https://www.nordtheme.com/
## blurb: Nord's "bright ambiance" (Snow Storm bg / Polar Night fg), with the
##        Frost/Aurora accents darkened to keep ~4.5:1 contrast on a light
##        background — a straight palette swap leaves green/yellow/cyan
##        nearly invisible since those hues were tuned for a dark canvas.
##        Same accent palette as the nord-snow-storm Neovim colorscheme.

foreground            #2e3440
background            #eceff4
selection_foreground  #2e3440
selection_background  #d8dee9

cursor            #2e3440
cursor_text_color #eceff4

url_color #486d9c

active_border_color   #486d9c
inactive_border_color #d8dee9
bell_border_color     #905986
visual_bell_color     none

active_tab_foreground   #eceff4
active_tab_background   #486d9c
inactive_tab_foreground #2e3440
inactive_tab_background #d8dee9
tab_bar_background      #e5e9f0
tab_bar_margin_color    none

mark1_foreground #eceff4
mark1_background #486d9c
mark2_foreground #eceff4
mark2_background #bb404c
mark3_foreground #eceff4
mark3_background #56743c

# black (kept dark, not inverted: many apps — Powerlevel10k included — assume
# color0 is always a dark "ink" regardless of overall terminal brightness)
color0 #2e3440
color8 #4c566a

# red
color1 #bb404c
color9 #bb404c

# green
color2  #56743c
color10 #56743c

# yellow / orange
color3  #8e640f
color11 #b04e2f

# blue
color4  #436f9a
color12 #486d9c

# magenta
color5  #905986
color13 #905986

# cyan / teal
color6  #2d7488
color14 #407473

# white (kept light, not inverted: badge/chip backgrounds in prompts like
# Powerlevel10k expect color7 to stay light regardless of terminal brightness)
color7  #d8dee9
color15 #f5f7fa
