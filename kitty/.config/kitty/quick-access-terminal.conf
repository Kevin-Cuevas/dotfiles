# ~/.config/kitty/quick-access-terminal.conf
# Configuration tuned for a Quake-style dropdown terminal

# ============================================
# SIZE AND POSITION
# ============================================
lines 26
columns 80
edge top
output_name eDP-1

# ============================================
# BEHAVIOR
# ============================================
hide_on_focus_loss yes
start_as_hidden no
focus_policy exclusive

# ============================================
# APPEARANCE
# ============================================
background_opacity 0.92
