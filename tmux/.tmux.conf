# ==========================================================
# TMUX CONFIG 
# ==========================================================

# ----------------------------------------------------------
# TERMINAL && COLORS
# ----------------------------------------------------------
set -as terminal-overrides ",*:RGB"
set -s set-clipboard on

# ----------------------------------------------------------
# GENERAL SETTINGS
# ----------------------------------------------------------
set -g mouse on                    # enable mouse support
set -g allow-passthrough on        # image passthrough for lazyvim
set -g visual-activity off         # disable visual notifications
set -sg escape-time 0

# ----------------------------------------------------------
# PREFIX && MAIN KEYBINDS
# ----------------------------------------------------------
unbind C-b                                # remove default prefix
set-option -g prefix C-a                  # set C-a as prefix
bind-key C-a send-prefix                  # send literal prefix w/ C-a C-a
bind C-l send-keys 'C-l' \; clear-history # ctrl+l ==> clear scrollback

# ----------------------------------------------------------
# PANE SPLITTING
# ----------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h             # horizontal split w/ |
bind - split-window -v             # vertical split w/ -

# ----------------------------------------------------------
# PANE NAVIGATION
# ----------------------------------------------------------
# alt + arrow keys (no conflict w/ lazyvim)
bind -n M-Left select-pane -L      # alt+<- --> left pane
bind -n M-Right select-pane -R     # alt+-> --> right pane
bind -n M-Up select-pane -U        # alt+up --> upper pane
bind -n M-Down select-pane -D      # alt+down --> lower pane

# ----------------------------------------------------------
# WINDOW MANAGEMENT
# ----------------------------------------------------------
bind c new-window -c "#{pane_current_path}"  # new window in $PWD

# numbering starts at 1 (more intuitive)
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# fast window switching (alt+N, no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# prev/next window (vim muscle memory)
bind -n M-p previous-window        # alt+p ==> previous
bind -n M-n next-window            # alt+n ==> next

# ----------------------------------------------------------
# UTILITIES
# ----------------------------------------------------------
bind r source-file ~/.tmux.conf    # prefix+r ==> reload config

# ----------------------------------------------------------
# PANE RESIZING
# ----------------------------------------------------------
# alt+shift+H/J/K/L -- no prefix == fluid af
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ----------------------------------------------------------
# ADVANCED PANE MANAGEMENT
# ----------------------------------------------------------
bind f resize-pane -Z              # prefix+f ==> toggle zoom
bind x kill-pane                   # prefix+x ==> kill pane (no confirm)
bind X kill-window                 # prefix+X ==> kill entire window
bind Space next-layout             # prefix+space ==> rotate layouts

# ----------------------------------------------------------
# SMART SPLITS (always in $PWD)
# ----------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ----------------------------------------------------------
# COPY MODE (vim-compatible)
# ----------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ----------------------------------------------------------
# PANE SYNC (useful for multi-server ops)
# ----------------------------------------------------------
bind S set-window-option synchronize-panes\; display-message "Sync panes: #{?synchronize-panes,ON,OFF}"

# ----------------------------------------------------------
# STATUS BAR POSITION
# ----------------------------------------------------------
# set -g status-position top       # uncomment for top bar

# ----------------------------------------------------------
# PLUGINS
# ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'          # plugin manager
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-resurrect'  # save sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save sessions

# ----------------------------------------------------------
# THEME: Nord Dashboard + Powerline Path
# ----------------------------------------------------------
# :: status bar ::
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left-length 90
set -g status-right-length 180

# left: PREFIX badge --> session --> current pane path
set -g status-left "#{?client_prefix,#[bg=#EBCB8B fg=#2E3440 bold]  PREFIX  #[bg=#2E3440 fg=#EBCB8B],#[bg=#88C0D0 fg=#2E3440 bold] 󰎤 #S #[bg=#2E3440 fg=#88C0D0]}#[bg=#3B4252,fg=#2E3440]#[bg=#3B4252,fg=#81A1C1]"

# right: user, hostname, time && date
set -g status-right "#{?#{==:#{pane_current_command},ssh},󰒍 server,󰉋 #{b:pane_current_path}} #[bg=#2E3440,fg=#3B4252] #[fg=#4C566A]│ #[fg=#A3BE8C]󰀄 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_user},#{@ssh_user},…},#(whoami)} #[fg=#4C566A]│ #[fg=#81A1C1] 󰣚 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_host},#{@ssh_host},…},#H} #[fg=#4C566A]"

# windows: zoom icon appears automatically on prefix+z
set -g window-status-format " #[fg=#4C566A]#I #[fg=#4C566A]#W "
set -g window-status-current-format "#[bg=#3B4252,fg=#88C0D0,bold] #I #[fg=#ECEFF4]#W#{?window_zoomed_flag, #[fg=#D08770]󰍉 ,} "
set -g window-status-separator ""

# :: pane borders ::
set -g pane-border-style "fg=#434C5E"
set -g pane-active-border-style "fg=#88C0D0"

# :: messages ::
set -g message-style "bg=#3B4252,fg=#EBCB8B"
set -g message-command-style "bg=#3B4252,fg=#88C0D0"

# :: copy mode ::
set -g mode-style "bg=#434C5E,fg=#ECEFF4"

# ----------------------------------------------------------
# DUAL STATUS BAR SPACING
# ----------------------------------------------------------
set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g status-format[0] '#[bg=#2e3440,fill=#2e3440]#[align=centre] '

# ----------------------------------------------------------
# TPM INIT (always at the end, no exceptions)
# ----------------------------------------------------------
run-shell ~/.tmux/plugins/tpm/tpm
