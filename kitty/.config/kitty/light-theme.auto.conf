# vim:ft=kitty
## name: Nord Light (Snow Storm)
## author: Eric N. Vander Weele (dark original) / adaptado a claro
## upstream: https://www.nordtheme.com/
## blurb: Tema Nord claro construido con la paleta Snow Storm como fondo
##        y Polar Night como texto, usando Frost y Aurora sin modificar.

# Basic colors
foreground           #2e3440
background           #eceff4
selection_foreground #2e3440
selection_background #d8dee9

# Cursor colors
cursor            #2e3440
cursor_text_color #eceff4

# URL underline color when hovering with mouse
url_color #5e81ac

# Window border colors and terminal bell colors
active_border_color   #5e81ac
inactive_border_color #d8dee9
bell_border_color     #d08770
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #eceff4
active_tab_background   #5e81ac
inactive_tab_foreground #434c5e
inactive_tab_background #d8dee9
tab_bar_background      #e5e9f0
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #2e3440
mark1_background #88c0d0
mark2_foreground #eceff4
mark2_background #bf616a
mark3_foreground #2e3440
mark3_background #ebcb8b

# The basic 16 colors
# black
color0 #3b4252
color8 #4c566a

# red
color1 #bf616a
color9 #bf616a

# green
color2  #a3be8c
color10 #a3be8c

# yellow
color3  #d08770
color11 #ebcb8b

# blue
color4  #81a1c1
color12 #5e81ac

# magenta
color5  #b48ead
color13 #b48ead

# cyan
color6  #88c0d0
color14 #8fbcbb

# white (kept light, not inverted: Powerlevel10k assumes color7/15 are
# always light for badge/chip backgrounds, regardless of terminal brightness)
color7  #d8dee9
color15 #eceff4
