# ~/.config/kitty/quick-access-terminal.conf
# Configuración optimizada para dropdown terminal estilo Quake

# ============================================
# TAMAÑO Y POSICIÓN
# ============================================
lines 26
columns 80
edge top

# ============================================
# COMPORTAMIENTO
# ============================================
hide_on_focus_loss yes
start_as_hidden no
focus_policy exclusive

# ============================================
# APARIENCIA VISUAL
# ============================================
background_opacity 0.92
