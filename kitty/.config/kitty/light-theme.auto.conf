# vim:ft=kitty
## name: Nord Aurora Pastel (light)
## author: Iceberg base (cocopon/gkeep) + Nord accents (Eric N. Vander Weele)
## upstream: https://gist.github.com/gkeep/3434864a3321fcce7d69e75d6d63888e
##           + https://www.nordtheme.com/
## blurb: Iceberg Light's structure with an almost monochrome palette of
##        Nord blues and grays (Frost 81a1c1/5e81ac/88c0d0/8fbcbb + Polar
##        Night 3b4252/434c5e/4c566a), with red bf616a and green a3be8c as
##        the only exceptions. Background from the original Nord Snow Storm
##        (#eceff4) instead of Iceberg's darker one (#e8e9ec). The
##        "near-background" tones inherited from Iceberg (selection_background,
##        borders, tab bar, color5/7) were calibrated for that darker
##        background, and against this paler one they looked like a box of a
##        different color (nvim's NormalFloat/FloatBorder) -- they were
##        replaced by their canonical Nord equivalents (Nord4 #d8dee9, Nord5
##        #e5e9f0).
##        "Aurora Pastel" (2026-10-31): three warm Nord Aurora tones come back
##        in the bright yellow/orange/magenta slots (amber, peach, purple),
##        darkened to read as text; blues, green, red and grays stay the same
##        (they're also p10k/tmux badge backgrounds).

# Basic colors
foreground           #33374c
background           #eceff4
selection_foreground #33374c
selection_background #d8dee9

# Cursor colors
cursor            #33374c
cursor_text_color #eceff4

# URL underline color when hovering with mouse
url_color #5e81ac

# Window border colors and terminal bell colors
active_border_color   #5e81ac
inactive_border_color #d8dee9
bell_border_color     #bf616a
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #eceff4
active_tab_background   #5e81ac
inactive_tab_foreground #4c566a
inactive_tab_background #d8dee9
tab_bar_background      #e5e9f0
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #eceff4
mark1_background #88c0d0
mark2_foreground #eceff4
mark2_background #bf616a
mark3_foreground #33374c
mark3_background #a3be8c

# The basic 16 colors -- almost monochrome Nord blue-gray, with red/green as
# the only exceptions (see blurb)
# black -- Polar Night gray, not color3/11 with warmth (no yellow/orange in
# this palette)
color0 #3b4252
color8 #434c5e

# red -- the only exception besides green
color1 #bf616a
color9 #bf616a

# green -- the other exception
color2  #a3be8c
color10 #a3be8c

# "yellow/orange" -- Aurora Pastel: amber (Nord13) and peach (Nord12)
# darkened to >= 4.6:1 on the background (as text: p10k context, tmux
# messages, git/ls), same tones as nvim. Before: gray #3b4252/#4c566a
color3  #8a6418
color11 #a85237

# blue -- the dominant accent
color4  #81a1c1
color12 #5e81ac

# magenta -- no purple in this palette
# color5 (regular, not bright) keeps working as a "blend with bg" accent for
# lavat's rim (see the zsh alias) -- a light gray close to this background.
# color13: Aurora Pastel, darkened purple (Nord15) (gray #434c5e before).
# color5 doesn't change because of lavat's rim.
color5  #d8dee9
color13 #8b5c83

# cyan -- blue-frost family
color6  #88c0d0
color14 #8fbcbb

# white (kept light, not inverted: Powerlevel10k assumes color7/15 are
# always light for badge/chip backgrounds, regardless of terminal brightness)
color7  #d8dee9
color15 #eceff4

# p10k surface (color237) -- the one slot that DOES flip with the theme: the
# status/jobs/context segments use it as background. color0 stays dark for
# the badges, so with bg=0 those segments were a dark slab in light mode.
# Index 237 because its xterm default (#3a3a3a) is ~color0: Konsole and Termux
# (16-colour schemes only) keep the old dark look instead of breaking.
color237 #e5e9f0
