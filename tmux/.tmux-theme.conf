# ----------------------------------------------------------
# THEME COLORS: Nord, via terminal palette (surfaces: see SURFACES)
#
# Uses `default` + indexed colours (colour0-15) instead of hex, so the
# status bar just inherits whatever palette the terminal (kitty) currently
# has loaded — including its own light/dark auto-switch. No watcher, no
# systemd service, and it also picks up the *local* kitty theme when tmux
# is running on a remote host over SSH, since palette-index -> RGB is
# resolved client-side by the terminal doing the rendering, not by tmux.
#
# Trade-off: only 16 slots, and kitty's light palette turns colour3/11 grey
# (no warm hues there), so the PREFIX badge and the zoom icon changed hue by
# accident between modes. On tmux 3.8 they use ${WARM} instead (SURFACES).
# ----------------------------------------------------------
# SURFACES (tmux 3.8+ themes)
#
# Accents above/below stay colour0-15, but a *surface* can't: kitty's light
# palette keeps colour0 dark and colour15 light (p10k badges need that), so
# the current-tab block, messages and copy-mode selection showed up as dark
# slabs in light mode. 3.8 knows the client's light/dark (`theme detect`:
# kitty reports it and notifies on changes; a remote 3.8 inside a local 3.8
# pane gets it too), so surfaces use theme colours, mapped to Nord below.
# The same colours also style what we never set: menus, popups, choose-tree,
# copy-mode matches, display-panes, scrollbars.
#   dark  = canonical Nord
#   light = Nord Aurora Pastel: surface #e5e9f0 on bg #eceff4, lines
#           #d8dee9, text #33374c; frost blues + green/red, and Aurora's
#           amber/purple for "yellow"/"magenta" (amber softened to #dcb46a so
#           a dark-text badge on it still reads, 5.2:1).
# Older tmux (no theme options) skips this and keeps the old colour0/15/8.
# ----------------------------------------------------------
%if "#{!=:#{dark-theme-black},}"
set -s theme detect

set -g dark-theme-black      "#2e3440"
set -g dark-theme-white      "#eceff4"
set -g dark-theme-light-grey "#4c566a"
set -g dark-theme-dark-grey  "#3b4252"
set -g dark-theme-green      "#a3be8c"
set -g dark-theme-yellow     "#ebcb8b"
set -g dark-theme-red        "#bf616a"
set -g dark-theme-blue       "#81a1c1"
set -g dark-theme-cyan       "#88c0d0"
set -g dark-theme-magenta    "#b48ead"

# black = text on an accent, white = text on a surface: both dark here
set -g light-theme-black      "#2e3440"
set -g light-theme-white      "#33374c"
set -g light-theme-light-grey "#d8dee9"
set -g light-theme-dark-grey  "#e5e9f0"
set -g light-theme-green      "#a3be8c"
set -g light-theme-yellow     "#dcb46a"
set -g light-theme-red        "#bf616a"
set -g light-theme-blue       "#5e81ac"
set -g light-theme-cyan       "#88c0d0"
set -g light-theme-magenta    "#b48ead"

%hidden SURFACE="themedarkgrey"
%hidden ON_SURFACE="themewhite"
%hidden SELECTION="themelightgrey"
# PREFIX badge, zoom icon and the light/dark icon: gold in dark, frost in light
%hidden WARM="themeyellow"
%hidden THEME_ICON=" #[fg=colour8] #[fg=themeyellow]#{?#{==:#{client_theme},light},󰖨,󰖔}"

# pane strip (status-format[0]): float 󰖲 (alt+t), the zoomed pane 󰍉 in
# ${WARM}, and the panes hidden behind the zoom 󰈉 dimmed
%hidden PANE_MARK="#{?pane_floating_flag,󰖲 ,#{?pane_zoomed_flag,#[fg=themeyellow]󰍉 ,#{?window_zoomed_flag,#[fg=colour8]#[dim]󰈉 ,}}}"

# zoom: the active border turns ${WARM} too (the 󰍉 icon alone is easy to
# miss); window-level, so only the zoomed window changes
set-hook -g window-zoomed "set -w pane-active-border-style fg=themeyellow"
set-hook -g window-unzoomed "set -wu pane-active-border-style"

# copy mode: a scrollbar on the right shows where you are in the history
# (handy in a big zoomed pane) and hides by itself when not in use; it
# overlays the pane, nothing reflows
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=themedarkgrey,fg=themeblue,width=1,pad=0"
%else
%hidden SURFACE="colour0"
%hidden ON_SURFACE="colour15"
%hidden SELECTION="colour8"
%hidden WARM="colour3"
%hidden THEME_ICON=""
%hidden PANE_MARK=""
%endif

set -g status-style "bg=default,fg=default"

# Pills like the p10k prompt (rounded caps \ue0b6/\ue0b4, thin \ue0b3 between
# parts), on ${SURFACE} so they blend in both light and dark.
# left: session pill (PREFIX while the prefix is pending) + state badges:
# COPY (copy mode), SYNC (synchronize-panes: typing goes to every pane, red
# on purpose), ZOOM. Inside #{?...} styles use spaces, not commas.
set -g status-left "#{?client_prefix,#[fg=${WARM} bg=default]#[bg=${WARM} fg=colour0 bold] PREFIX #[fg=${WARM} bg=default nobold],#[fg=${SURFACE} bg=default]#[bg=${SURFACE} fg=colour6 bold]󰎤 #S#[fg=${SURFACE} bg=default nobold]} #{?pane_in_mode,#[fg=colour4 bg=default]#[bg=colour4 fg=colour0 bold]󰆏 COPY#[fg=colour4 bg=default nobold] ,}#{?synchronize-panes,#[fg=colour1 bg=default]#[bg=colour1 fg=colour15 bold]󰓦 SYNC#[fg=colour1 bg=default nobold] ,}#{?window_zoomed_flag,#[fg=${WARM} bg=default]#[bg=${WARM} fg=colour0 bold]󰍉 ZOOM#[fg=${WARM} bg=default nobold] ,}"

# right: one pill with path, user, host and the light/dark icon
set -g status-right "#[fg=${SURFACE} bg=default]#[bg=${SURFACE} fg=colour4]#{?#{==:#{pane_current_command},ssh},󰒍 server,󰉋 #{b:pane_current_path}} #[fg=colour8] #[fg=colour2]󰀄 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_user},#{@ssh_user},…},#{user}} #[fg=colour8] #[fg=colour4]󰣚 #{?#{==:#{pane_current_command},ssh},#{?#{@ssh_host},#{@ssh_host},…},#H}${THEME_ICON}#[fg=${SURFACE} bg=default]"

# ----------------------------------------------------------
# LABEL HELPERS  (expanded elsewhere via #{E:@name})
# ----------------------------------------------------------
# @cmd_icon  : Nerd Font glyph for the pane's running command. It's a flat
#              #{?cond,icon,#{?cond,icon,...,fallback}} chain, one clause per
#              icon; each cond is an OR of #{==:#{pane_current_command},name}.
#              To map a new command, drop another #{==:...} into the matching
#              clause's #{||:...}. Every glyph has a one-space suffix (uniform:
#              FiraCode NF advances are all 1 cell) and the last clause doubles
#              as the fallback -- a terminal glyph for shells / unknown commands.
# @pane_label: the active pane's custom @pane_name, else its running command.
# @win_label : the text a tab shows in the status bar --
#   * tab NOT renamed        -> @pane_label   (live: command or pane name)
#   * tab renamed (prefix ,) -> your custom name, followed by @pane_label in
#                               dim grey (active pane's custom name, else its
#                               running command); the suffix is hidden when it
#                               would just repeat the tab name.
#   Detection: `rename-window` flips `automatic-rename` off on that window,
#   so #{automatic-rename} == our "is this tab manually named?" flag.
#   prefix , with an empty name flips automatic-rename back on (default).
set -g @cmd_icon "#{?#{||:#{==:#{pane_current_command},nvim},#{||:#{==:#{pane_current_command},vim},#{||:#{==:#{pane_current_command},vi},#{||:#{==:#{pane_current_command},hx},#{==:#{pane_current_command},nano}}}}}, ,#{?#{||:#{==:#{pane_current_command},node},#{||:#{==:#{pane_current_command},npm},#{||:#{==:#{pane_current_command},pnpm},#{||:#{==:#{pane_current_command},yarn},#{||:#{==:#{pane_current_command},bun},#{||:#{==:#{pane_current_command},deno},#{||:#{==:#{pane_current_command},tsx},#{||:#{==:#{pane_current_command},vite},#{==:#{pane_current_command},nodemon}}}}}}}}}, ,#{?#{||:#{==:#{pane_current_command},python},#{||:#{==:#{pane_current_command},python3},#{==:#{pane_current_command},ipython}}}, ,#{?#{||:#{==:#{pane_current_command},ssh},#{||:#{==:#{pane_current_command},mosh},#{==:#{pane_current_command},sftp}}}, ,#{?#{||:#{==:#{pane_current_command},cmus},#{||:#{==:#{pane_current_command},ncmpcpp},#{||:#{==:#{pane_current_command},mpv},#{||:#{==:#{pane_current_command},mpd},#{==:#{pane_current_command},spotify_player}}}}}, ,#{?#{||:#{==:#{pane_current_command},git},#{||:#{==:#{pane_current_command},lazygit},#{||:#{==:#{pane_current_command},tig},#{||:#{==:#{pane_current_command},gh},#{==:#{pane_current_command},gitui}}}}}, ,#{?#{||:#{==:#{pane_current_command},docker},#{||:#{==:#{pane_current_command},docker-compose},#{||:#{==:#{pane_current_command},lazydocker},#{||:#{==:#{pane_current_command},kubectl},#{||:#{==:#{pane_current_command},k9s},#{==:#{pane_current_command},podman}}}}}}, ,#{?#{||:#{==:#{pane_current_command},htop},#{||:#{==:#{pane_current_command},btop},#{||:#{==:#{pane_current_command},btm},#{||:#{==:#{pane_current_command},top},#{==:#{pane_current_command},glances}}}}}, ,#{?#{||:#{==:#{pane_current_command},psql},#{||:#{==:#{pane_current_command},mysql},#{||:#{==:#{pane_current_command},mycli},#{||:#{==:#{pane_current_command},sqlite3},#{==:#{pane_current_command},redis-cli}}}}}, ,#{?#{||:#{==:#{pane_current_command},lf},#{||:#{==:#{pane_current_command},yazi},#{||:#{==:#{pane_current_command},ranger},#{||:#{==:#{pane_current_command},nnn},#{==:#{pane_current_command},fzf}}}}}, ,#{?#{||:#{==:#{pane_current_command},man},#{||:#{==:#{pane_current_command},less},#{||:#{==:#{pane_current_command},bat},#{==:#{pane_current_command},moar}}}}, ,#{?#{||:#{==:#{pane_current_command},cargo},#{==:#{pane_current_command},rustc}}, ,#{?#{||:#{==:#{pane_current_command},go},#{==:#{pane_current_command},gopls}}, ,#{?#{||:#{==:#{pane_current_command},make},#{||:#{==:#{pane_current_command},cmake},#{||:#{==:#{pane_current_command},gcc},#{||:#{==:#{pane_current_command},cc},#{==:#{pane_current_command},ninja}}}}}, ,#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},sh},#{==:#{pane_current_command},dash}}}}}, , }}}}}}}}}}}}}}}"
set -g @pane_label "#{?#{@pane_name},#{@pane_name},#{pane_current_command}}"
set -g @win_label "#{?automatic-rename,#{E:@pane_label},#W#{?#{==:#W,#{E:@pane_label}},,#[fg=colour8]·#{E:@pane_label}}}"

# automatic-rename-format still feeds #W (used by choose-tree, etc.) when a
# tab is on auto; the status bar itself renders @win_label above.
set -g automatic-rename-format "#{?#{@pane_name},#{@pane_name},#{pane_current_command}}"
set -g window-status-format " #[fg=colour8]#I #{E:@cmd_icon}#[fg=colour8]#{E:@win_label} "
set -g window-status-current-format "#[fg=colour6 bg=default]#[bg=colour6 fg=colour0 bold]#I #{E:@cmd_icon}#[nobold]#{E:@win_label}#[fg=colour6 bg=default]"

# :: pane borders ::
# title on each pane's top border, plain: it takes the border colour (cyan
# active, ${WARM} zoomed, grey the rest). The path shows $HOME as ~
# (expanded per host when the config loads), then keeps its last 24 chars.
%hidden PANE_PATH="#{=/-24/…:#{s|^$HOME$|~|;s|^$HOME/|~/|:pane_current_path}}"
set -g pane-border-format " #{pane_index} #{E:@cmd_icon}#{E:@pane_label} → ${PANE_PATH} "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"

# :: messages ::
set -g message-style "bg=${SURFACE},fg=colour3"
set -g message-command-style "bg=${SURFACE},fg=colour6"

# :: copy mode ::
set -g mode-style "bg=${SELECTION},fg=${ON_SURFACE}"

# :: dual status bar ::
# line 1 (bottom) = the real bar   line 0 (above it) = live pane strip
# the -Fg copy grabs the stock bar template before we touch anything, so it
# still resolves status-left/right/window-status at render time.
set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g  'status-format[0]' "#[align=centre]#{P:#{?pane_active,#[fg=colour6]#[bold],#[fg=colour8]#[nobold]}#[nodim]${PANE_MARK}#{pane_index} #{E:@cmd_icon}#{E:@pane_label}   }"

